services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    restart: on-failure
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: true
      TELEGRAM_HTTP_PORT: ${TELEGRAM_HTTP_PORT}
    volumes:
      - telegram-bot-data:/var/lib/telegram-bot-api
    ports:
      - "${TELEGRAM_HTTP_PORT}:${TELEGRAM_HTTP_PORT}"
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    restart: on-failure
    entrypoint: whisper-server
    ports:
      - "${WHISPER_HTTP_PORT}:${WHISPER_HTTP_PORT}"
    command: >
      --host 0.0.0.0
      --port ${WHISPER_HTTP_PORT}
      -m /models/${WHISPER_MODEL_NAME}
      -sow
      --vad
      -vm /models/${VAD_MODEL_NAME}
    volumes:
      - whisper_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    volumes:
      - telegram-bot-data:/var/lib/telegram-bot-api
    environment:
      - TOKEN=${TOKEN}
      - BOT_API_BASE_URL=http://telegram-bot-api:${TELEGRAM_HTTP_PORT}
      - WHISPER_API_BASE_URL=http://whisper:${WHISPER_HTTP_PORT}
volumes:
  telegram-bot-data:
  whisper_models:
