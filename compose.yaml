services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: true
      TELEGRAM_HTTP_PORT: 8081
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    entrypoint: whisper-server
    ports:
      - "8082:8082"
    command: >
      --host 0.0.0.0
      --port 8082
      -m /models/${WHISPER_MODEL_NAME}
    volumes:
      - whisper_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    environment:
      - TOKEN=${TOKEN}
      - TG_BASE_URL=http://telegram-bot-api:8081
      - WHISPER_BASE_URL=http://whisper:8082
volumes:
  telegram-bot-api-data:
  whisper_models:
